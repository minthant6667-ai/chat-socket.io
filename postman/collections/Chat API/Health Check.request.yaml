$kind: http-request
name: Health Check
order: 4000
method: GET
url: '{{baseUrl}}/api/health'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Server is running", () => pm.expect(res.success).to.be.true);
      pm.test("Has mongodb status", () => pm.expect(res.mongodb).to.be.a("string"));
      pm.test("Has port", () => pm.expect(res.port).to.exist);
      console.log("MongoDB status:", res.mongodb);
