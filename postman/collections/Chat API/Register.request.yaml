$kind: http-request
name: Register
order: 1000
method: POST
url: '{{baseUrl}}/api/auth/register'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "testuser",
      "email": "testuser@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Has token", () => pm.expect(res.token).to.be.a("string"));
      pm.test("Has user object", () => pm.expect(res.user).to.be.an("object"));
      pm.test("User has id", () => pm.expect(res.user.id).to.exist);
      pm.test("User has username", () => pm.expect(res.user.username).to.be.a("string"));
      if (res.token) {
        pm.environment.set("token", res.token);
      }
      if (res.user && res.user.id) {
        pm.environment.set("userId", res.user.id);
      }
