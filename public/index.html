<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
  integrity="sha512-1PKOgIY59xJ8Co8+NE6FZ+LOAZKjy+KY8iq0G4B3CyeY6wYHN3yt9PW0XpSriVlkMXe40PTKnXrLnZ9+fkDaog=="
  crossorigin="anonymous"
/>

<link rel="stylesheet" href="style.css" />

<title>iChat - Real-Time Chat</title>


  </head>

  <body>
    <header class="chat-header">
      <h1 class="title">iChat 💬</h1>
      <p class="subtitle">Real-time chat room</p>
    </header>


<main class="main">
  <!-- Username -->
  <div class="name">
    <span>
      <i class="far fa-user"></i>
    </span>

    <input
      type="text"
      id="name-input"
      class="name-input"
      value="anonymous"
      maxlength="20"
      placeholder="Enter your name"
      autocomplete="off"
    />
  </div>

  <!-- Online Status -->
  <div class="online-status">
    <span class="status-dot"></span>
    <span>Online</span>
  </div>

  <!-- Messages -->
  <ul class="message-container" id="message-container"></ul>

  <!-- Typing Feedback -->
  <div class="typing-area">
    <p class="feedback" id="feedback"></p>
  </div>

  <!-- Message Form -->
  <form class="message-form" id="message-form">
    <input
      type="text"
      name="message"
      id="message-input"
      class="message-input"
      placeholder="Type your message..."
      autocomplete="off"
      required
    />

    <div class="v-divider"></div>

    <button type="submit" class="send-button">
      Send
      <span>
        <i class="fas fa-paper-plane"></i>
      </span>
    </button>
  </form>
</main>

<!-- Client Counter -->
<footer class="chat-footer">
  <h3 class="clients-total" id="client-total">
    Total clients: 0
  </h3>
</footer>

<!-- Socket.IO -->
<script src="/socket.io/socket.io.js"></script>

<!-- Moment.js -->
<script
  src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.28.0/moment.min.js"
  integrity="sha512-Q1f3TS3vSt1jQ8AwP2OuenztnLU6LwxgyyYOG1jgMW/cbEMHps/3wjvnl1P3WTrF3chJUWEoxDUEjMxDV8pujg=="
  crossorigin="anonymous"
></script>

<!-- Chat JavaScript -->
<script src="main.js"></script>


  </body>
</html>
