<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>iChat - MongoDB</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="app">

    <!-- ============================= -->
    <!-- AUTH SECTION -->
    <!-- ============================= -->

    <section
      id="auth-section"
      class="card"
    >

      <h1>iChat</h1>

      <p class="subtitle">
        Socket.IO + MongoDB
      </p>

      <div class="tabs">

        <button
          id="show-login"
          class="active"
        >
          Login
        </button>

        <button
          id="show-register"
        >
          Register
        </button>

      </div>

      <!-- LOGIN -->

      <form id="login-form">

        <label>
          Email
        </label>

        <input
          id="login-email"
          type="email"
          required
        >

        <label>
          Password
        </label>

        <input
          id="login-password"
          type="password"
          required
        >

        <button type="submit">
          Login
        </button>

      </form>

      <!-- REGISTER -->

      <form
        id="register-form"
        class="hidden"
      >

        <label>
          Username
        </label>

        <input
          id="register-username"
          minlength="3"
          maxlength="30"
          required
        >

        <label>
          Email
        </label>

        <input
          id="register-email"
          type="email"
          required
        >

        <label>
          Password
        </label>

        <input
          id="register-password"
          type="password"
          minlength="6"
          required
        >

        <button type="submit">
          Create account
        </button>

      </form>

      <p
        id="auth-message"
        class="message"
      ></p>

    </section>


    <!-- ============================= -->
    <!-- CHAT SECTION -->
    <!-- ============================= -->

    <section
      id="chat-section"
      class="chat-layout hidden"
    >

      <!-- HEADER -->

      <header class="chat-header">

        <div>

          <h1>
            iChat
          </h1>

          <span id="current-user"></span>

        </div>

        <button
          id="logout-button"
          class="secondary"
        >
          Logout
        </button>

      </header>


      <!-- CHAT BODY -->

      <div class="chat-body">

        <!-- ========================= -->
        <!-- SIDEBAR -->
        <!-- ========================= -->

        <aside class="sidebar">

          <h3>
            Chat
          </h3>

          <button
            id="group-chat-button"
            class="chat-option active"
          >
            🌐 General Group
          </button>

          <h3>
            Users
          </h3>

          <div id="users-list"></div>

        </aside>


        <!-- ========================= -->
        <!-- CHAT PANEL -->
        <!-- ========================= -->

        <section class="chat-panel">

          <div class="chat-title">

            <div>

              <h2 id="chat-title">
                General Group
              </h2>

              <span id="client-total">
                0 online
              </span>

            </div>

          </div>


          <!-- MESSAGES -->

          <div
            id="message-container"
            class="messages"
          ></div>


          <!-- TYPING -->

          <p
            id="feedback"
            class="feedback"
          ></p>


          <!-- MESSAGE FORM -->

          <form
            id="message-form"
            class="message-form"
          >

            <input
              id="message-input"
              autocomplete="off"
              placeholder="Write a message..."
              maxlength="1000"
              required
            >

            <button type="submit">
              Send
            </button>

          </form>

        </section>

      </div>

    </section>

  </main>


  <script src="/socket.io/socket.io.js"></script>

  <script src="main.js"></script>

</body>
</html>
